version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - { db_type: uuid, go_type: string }
          - { db_type: uuid, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: citext, go_type: string }
          - { db_type: citext, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: timestamptz, go_type: { import: time, type: Time } }
          - { db_type: timestamptz, nullable: true, go_type: { import: time, type: Time, pointer: true } }
          - { db_type: jsonb, go_type: { import: encoding/json, type: RawMessage } }
          - { db_type: jsonb, nullable: true, go_type: { import: encoding/json, type: RawMessage } }
          - { db_type: inet, go_type: { import: net/netip, type: Addr } }
          - { db_type: inet, nullable: true, go_type: { import: net/netip, type: Addr, pointer: true } }
